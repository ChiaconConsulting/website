# Self-hosted deployment: database + one-off migration/seed + the website.
#   cp .env.example .env   (then edit the values)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiacon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chiacon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiacon -d chiacon"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:setup
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chiacon:${POSTGRES_PASSWORD}@db:5432/chiacon
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.chiacon.com}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chiacon:${POSTGRES_PASSWORD}@db:5432/chiacon
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
